name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x64
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests before release build
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binaries (CLI + GUI)
        run: cargo build --locked --release --target ${{ matrix.target }} --bins

      - name: Package macOS ARM64 (.app + CLI)
        if: matrix.asset_suffix == 'macos-arm64'
        shell: bash
        run: |
          rm -rf dist/stage && mkdir -p dist/stage
          chmod +x scripts/package-macos-app.sh
          ./scripts/package-macos-app.sh "target/${{ matrix.target }}/release/otp-tools-gui" dist/stage
          cp "target/${{ matrix.target }}/release/otp-tools" dist/stage/
          cp README.md LICENSE dist/stage/
          COPYFILE_DISABLE=1 tar -czf "dist/otp-tools-${{ matrix.asset_suffix }}.tar.gz" -C dist/stage .

      - name: Package Linux x64 (tar.gz)
        if: matrix.asset_suffix == 'linux-x64'
        shell: bash
        run: |
          rm -rf dist/stage && mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/otp-tools" dist/stage/
          cp "target/${{ matrix.target }}/release/otp-tools-gui" dist/stage/
          cp README.md LICENSE dist/stage/
          tar -czf "dist/otp-tools-${{ matrix.asset_suffix }}.tar.gz" -C dist/stage .

      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          if (Test-Path dist/stage) { Remove-Item -Recurse -Force dist/stage }
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/otp-tools.exe" dist/stage/
          Copy-Item "target/${{ matrix.target }}/release/otp-tools-gui.exe" dist/stage/
          Copy-Item README.md dist/stage/
          Copy-Item LICENSE dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/otp-tools-${{ matrix.asset_suffix }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: otp-tools-${{ matrix.asset_suffix }}
          path: dist/otp-tools-${{ matrix.asset_suffix }}.${{ matrix.archive }}

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS.txt
          sha256sum -- otp-tools-*.tar.gz otp-tools-*.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
