[package]
name = "otp-tools"
version = "0.1.0"
edition = "2021"
authors = ["Glauco G. Cetara <glaucogcetara@gmail.com>"]
description = "OTP Tools — CLI e GUI offline em Rust para ler QR Codes (PNG/JPG/JPEG), decodificar otpauth-migration://, analisar otpauth:// e gerar QR Codes por conta"
repository = "https://github.com/c3t4r4/otp-tools.git"
license = "MIT"

[[bin]]
name = "otp-tools"
path = "src/main.rs"

[[bin]]
name = "otp-tools-gui"
path = "src/bin/otp-tools-gui.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
cliclack = "0.3"
comfy-table = "7.1"
data-encoding = "2.6"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
libc = "0.2"
owo-colors = "4.1"
percent-encoding = "2.3"
prost = "0.13"
qrcode = "0.14"
rfd = "0.15"
rqrr = "0.8"
thiserror = "2.0"
url = "2.5"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
